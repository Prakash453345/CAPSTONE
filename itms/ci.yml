name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e packages/common
          pip install -e packages/domain
          pip install -e services/sim-service
          pip install -e services/api-service
          pip install -e packages/geo
          pip install -e services/vision-service

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy packages services

      - name: Test (unit + integration, redis service container available)
        env:
          REDIS_URL: redis://localhost:6379/0
          RUN_INTEGRATION_TESTS: "1"
        run: pytest -q
