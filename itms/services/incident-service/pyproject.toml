[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-service"
version = "0.1.0"
description = "[ARCH] M6 incident detection service: consumes traffic state, runs graph anomaly detector, produces incident candidates with conformal-calibrated alerting."
requires-python = ">=3.11"
dependencies = [
    "itms-common",
    "itms-domain",
    "itms-anomaly",
    "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
include = ["incident_service*"]
