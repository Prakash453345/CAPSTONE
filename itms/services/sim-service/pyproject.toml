[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-service"
version = "0.1.0"
description = "[ARCH] Phase-1 home for services 3 (Traffic), 4 (Signal Controller), 5 (Optimization Engine), 17 (Simulation Adapter), 19 (IoT Gateway), 20 (GPS/AVL Adapter). M2: safety kernel (control/safety) + fixed-time strategy + arbitration ladder (signal_controller)."
requires-python = ">=3.11"
dependencies = [
    "itms-common",
    "itms-domain",
    # Pinned exactly, not >=: A-CA-MP (M5) carries state across ticks
    # (EWMA load, a compounding hold-bias), which makes its results
    # sensitive to small version-to-version differences in SUMO's own
    # vehicle dynamics -- confirmed empirically when two sessions on two
    # different resolved eclipse-sumo versions got the same seeds but
    # measurably different A-CA-MP numbers, while the stateless Webster
    # and memory-less M4 CA-MP strategies reproduced almost exactly. An
    # open `>=` range means "reproduce this benchmark" silently stops
    # meaning the same thing on a different machine or after a future
    # `pip install`. See PROGRESS.md, "Fresh unified gate re-run".
    "eclipse-sumo==1.27.1",
    "traci==1.27.1",
    "sumolib==1.27.1",
    "pyproj>=3.6",
    # Hex grid for finding the crews nearest a call (control/dispatch/crew_index.py).
    "h3>=4.0",
]

[project.optional-dependencies]
# M6 anomaly detector only. The spatiotemporal graph autoencoder (plan 6.1)
# is the one trained-neural-net component in this repo; everything on the
# control path stays pure-stdlib and is unaffected by whether this is
# installed. `pip install -e 'services/sim-service[anomaly]'` (CPU wheels are
# enough -- the model is tens of thousands of parameters).
anomaly = [
    "torch>=2.2",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["sim_service*"]
