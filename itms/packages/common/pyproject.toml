[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itms-common"
version = "0.1.0"
description = "Shared event-bus client and (de)serialization for all ITMS services. [ARCH ADR-003]"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
    "fastavro>=1.9",
    "itms-domain",
]

[tool.setuptools.packages.find]
include = ["itms_common*"]
