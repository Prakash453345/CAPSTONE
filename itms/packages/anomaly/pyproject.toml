[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itms-anomaly"
version = "0.1.0"
description = "[ARCH] M6 anomaly detection: spatiotemporal graph autoencoder, EWMA baseline, and conformal calibration for incident detection."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torch_geometric>=2.5",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
]

[tool.setuptools.packages.find]
include = ["itms_anomaly*"]
