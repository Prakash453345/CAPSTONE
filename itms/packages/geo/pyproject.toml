[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itms-geo"
version = "0.1.0"
description = "Camera geometry for ITMS: pinhole and homography cameras, normalised-DLT calibration, road-network lane geometry from SUMO nets, and per-lane camera coverage. [ARCH §6, build guide §3.2.2 / §8.5] M8."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Only for RoadNetwork.xy_to_lonlat / lonlat_to_xy.
proj = ["pyproj>=3.6"]

[tool.setuptools.packages.find]
include = ["itms_geo*"]
