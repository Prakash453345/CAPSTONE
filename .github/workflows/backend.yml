name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/**/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e libs/domain -e libs/common -e libs/geo
          pip install -e services/simulation-service -e services/api-gateway -e services/vision-service

      # Lint (ruff) and type checks (mypy) are not gated yet: the codebase has
      # not been brought clean under them. Add them here once it is.
      - name: Test
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q -m "not slow_property"
