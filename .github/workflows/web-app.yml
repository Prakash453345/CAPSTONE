name: Web App CI

on:
  push:
    paths:
      - "itms/web-app/**"
      - ".github/workflows/web-app.yml"
  pull_request:
    paths:
      - "itms/web-app/**"
      - ".github/workflows/web-app.yml"

defaults:
  run:
    working-directory: itms/web-app

jobs:
  quality:
    name: Type-check · Lint · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: itms/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Bundle budget (365 KiB gzipped JS)
        run: |
          total=$(find dist/assets -name '*.js' -exec gzip -c {} \; | wc -c)
          limit=$((365 * 1024))
          echo "Gzipped JS: $((total / 1024)) KiB / 365 KiB"
          if [ "$total" -gt "$limit" ]; then
            echo "::error::Bundle budget exceeded: $((total / 1024)) KiB > 365 KiB"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: itms/web-app/dist
          retention-days: 3

  e2e:
    name: Playwright E2E + axe
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: itms/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: itms/web-app/playwright-report
          retention-days: 7
