[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-gateway"
version = "0.1.0"
description = "The HTTP/WebSocket entry point for the ITMS console: relays the live event bus, accepts operator commands, uploads road videos, and holds the human review gate (ADR-006). FastAPI, layered as core / api routes (controllers) / services / models."
requires-python = ">=3.11"
dependencies = [
    "itms-common",
    "itms-domain",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "pydantic>=2",
    "python-multipart>=0.0.9",  # video clip uploads (POST /v1/clips)
]

[tool.setuptools.packages.find]
include = ["api_gateway*"]
