<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Pre-paint theme (mirrors src/store/themeStore.ts) so there is no flash.
      (function () {
        var m = "system";
        try { m = localStorage.getItem("traffix.theme") || "system"; } catch (e) {}
        var dark = m === "dark" || (m !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <title>Traffix</title>
    <meta
      name="description"
      content="Traffix spots accidents on city cameras, has an operator confirm them, sends the nearest ambulance and turns the traffic lights on its route green."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Traffix" />
    <meta property="og:title" content="Traffix: traffic lights that clear the way for ambulances" />
    <meta
      property="og:description"
      content="Accident detection, operator review, ambulance dispatch and green corridors on one live map of the city."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23151a26'/%3E%3Cpath d='M16 5v22M5 16h22' stroke='%237b93ff' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23151a26' stroke='%237b93ff' stroke-width='2.5'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..800&family=Google+Sans+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
